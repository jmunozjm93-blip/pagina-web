<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboards Sell Out</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif; background:#111; color:#111; }

  .split { display:flex; min-height:100vh; }
  .panel { position:relative; flex:1 1 50%; display:flex; text-decoration:none; color:inherit; overflow:hidden; transition:flex .45s cubic-bezier(.4,0,.2,1); }
  .split:hover .panel { flex:1 1 44%; }
  .split .panel:hover { flex:1 1 56%; }

  /* ---------- CONVERSE ---------- */
  .converse { background:#fff; color:#111; }
  .converse .copy { position:relative; z-index:2; width:38%; min-width:250px; padding:48px 32px 48px 48px; display:flex; flex-direction:column; justify-content:center; gap:14px; }
  .converse .kicker { font-size:.85rem; letter-spacing:.14em; text-transform:uppercase; font-weight:500; }
  .converse h1 { font-size:clamp(3rem,6vw,5.5rem); line-height:.88; font-weight:900; letter-spacing:-.03em; text-transform:uppercase; display:flex; flex-direction:column; }
  .converse h1 .row { display:flex; align-items:center; gap:.18em; }
  .converse h1 svg { width:.62em; height:.62em; flex:none; }
  .converse .sub { font-size:1.05rem; margin-top:6px; color:#333; }
  .converse .btn { align-self:flex-start; margin-top:18px; background:#111; color:#fff; padding:14px 34px; font-weight:700; font-size:1rem; letter-spacing:.02em; }
  .converse .grid { flex:1; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(2,1fr); gap:6px; padding:6px; background:#f2f2f2; }
  .converse .grid div { background:#fff center/cover no-repeat; transition:transform .5s; }
  .converse:hover .grid div { transform:scale(1.03); }
  .converse .grid .alt { background-color:#ececec; background-blend-mode:multiply; }

  /* ---------- STEVE MADDEN ---------- */
  .madden { background:#0b0b0b url("img/steve-madden-hero.jpg") center/cover no-repeat; color:#fff; align-items:flex-end; }
  .madden::before { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.15) 40%,rgba(0,0,0,.78) 100%); transition:background .4s; }
  .madden:hover::before { background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,.05) 40%,rgba(0,0,0,.7) 100%); }
  .madden .copy { position:relative; z-index:2; width:100%; padding:48px; display:flex; flex-direction:column; gap:14px; }
  .madden .logo { width:min(420px,80%); height:auto; margin-bottom:auto; filter:drop-shadow(0 2px 8px rgba(0,0,0,.6)); }
  .madden .kicker { font-size:.85rem; letter-spacing:.14em; text-transform:uppercase; opacity:.85; }
  .madden h1 { font-size:clamp(3rem,6vw,5.5rem); line-height:.88; font-weight:900; letter-spacing:-.03em; text-transform:uppercase; text-shadow:0 2px 14px rgba(0,0,0,.5); }
  .madden .sub { font-size:1.05rem; opacity:.9; margin-top:6px; }
  .madden .btn { align-self:flex-start; margin-top:18px; background:#fff; color:#111; padding:14px 34px; font-weight:700; font-size:1rem; letter-spacing:.02em; }
  .madden .logo-top { position:absolute; top:40px; left:48px; z-index:2; }

  .btn { transition:transform .2s, box-shadow .2s; }
  .panel:hover .btn { transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.25); }

  footer { position:fixed; bottom:10px; left:50%; transform:translateX(-50%); z-index:5; font-size:.72rem; color:#888; background:rgba(255,255,255,.85); padding:4px 12px; border-radius:999px; white-space:nowrap; }

  @media (max-width:820px) {
    .split { flex-direction:column; }
    .panel, .split:hover .panel, .split .panel:hover { flex:none; min-height:100vh; }
    .converse { flex-direction:column; }
    .converse .copy { width:100%; padding:40px 24px 24px; }
    .converse .grid { min-height:52vh; }
    .madden .copy { padding:40px 24px; }
    .madden .logo-top { top:28px; left:24px; }
    footer { position:static; transform:none; display:block; text-align:center; background:#111; color:#888; border-radius:0; padding:10px; }
  }
</style>
</head>
<body>
<div class="split">

  <a class="panel converse" href="Dashboard%20sell%20out.html" aria-label="Dashboard Sell Out Converse">
    <div class="copy">
      <div class="kicker">Sell Out Semanal</div>
      <h1>
        <span class="row">Conv<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="40,4 92,50 40,96 20,96 64,50 20,4" fill="#111"/><polygon points="24,32 30,50 24,68 12,57 0,50 12,43" fill="#111"/></svg></span>
        <span class="row">erse</span>
      </h1>
      <div class="sub">Calzado, Ropa, Accesorios y Tiendas. Semanas 27 a 37.</div>
      <span class="btn">Ver dashboard</span>
    </div>
    <div class="grid">
      <div style="background-image:url('img/converse-chuck-hi-negra.jpg')"></div>
      <div class="alt" style="background-image:url('img/converse-chuck-hi-blanca.jpg')"></div>
      <div style="background-image:url('img/converse-chuck-hi-roja.jpg')"></div>
      <div class="alt" style="background-image:url('img/converse-chuck-low-negra.jpg')"></div>
      <div style="background-image:url('img/converse-chuck-hi-negra-mono.jpg')"></div>
      <div class="alt" style="background-image:url('img/converse-chuck-low-blanca.jpg')"></div>
    </div>
  </a>

  <a class="panel madden" href="Dashboard%20Steve%20Madden.html" aria-label="Dashboard Sell Out Steve Madden">
    <img class="logo logo-top" src="img/steve-madden-logo.png" alt="Steve Madden">
    <div class="copy">
      <div class="kicker">Sell Out</div>
      <h1>Steve<br>Madden</h1>
      <div class="sub">Dashboard de la marca Steve Madden.</div>
      <span class="btn">Ver dashboard</span>
    </div>
  </a>

</div>
<footer>Grupo Depor · actualizado al 15 de septiembre de 2026</footer>
</body>
</html>
