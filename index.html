<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboards Sell Out</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif; background:#111; color:#111; }

  .split { display:flex; min-height:100vh; }
  .panel { position:relative; flex:1 1 50%; display:flex; align-items:flex-end; text-decoration:none; color:#fff; overflow:hidden; transition:flex .45s cubic-bezier(.4,0,.2,1); }
  .split:hover .panel { flex:1 1 44%; }
  .split .panel:hover { flex:1 1 56%; }
  .panel::before { content:""; position:absolute; inset:0; z-index:1; transition:background .4s; }
  .panel .copy { position:relative; z-index:2; width:100%; padding:48px; display:flex; flex-direction:column; gap:14px; }
  .kicker { font-size:.85rem; letter-spacing:.14em; text-transform:uppercase; opacity:.85; }
  h1 { font-size:clamp(3rem,6vw,5.5rem); line-height:.88; font-weight:900; letter-spacing:-.03em; text-transform:uppercase; text-shadow:0 2px 14px rgba(0,0,0,.5); }

  /* ---------- CONVERSE / UMBRO / FILA (carrusel) ---------- */
  .multi { background:#111; }
  .multi::before { background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,0) 35%,rgba(0,0,0,.72) 100%); }
  .multi:hover::before { background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,0) 35%,rgba(0,0,0,.62) 100%); }
  .slide { position:absolute; inset:0; background-size:cover; background-position:center; opacity:0; transition:opacity 1.2s ease; will-change:opacity; }
  .slide.on { opacity:1; }
  .multi h1 { position:relative; height:.88em; }
  .multi h1 span { position:absolute; left:0; bottom:0; opacity:0; transform:translateY(8px); transition:opacity .6s ease, transform .6s ease; white-space:nowrap; }
  .multi h1 span.on { opacity:1; transform:none; }
  .dots { display:flex; gap:8px; margin-top:8px; }
  .dots i { width:26px; height:3px; background:rgba(255,255,255,.35); transition:background .3s; }
  .dots i.on { background:#fff; }

  /* ---------- STEVE MADDEN ---------- */
  .madden { background:#0b0b0b url("img/steve-madden-hero.jpg") center/cover no-repeat; }
  .madden::before { background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.15) 40%,rgba(0,0,0,.78) 100%); }
  .madden:hover::before { background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,.05) 40%,rgba(0,0,0,.7) 100%); }

  footer { position:fixed; bottom:10px; left:50%; transform:translateX(-50%); z-index:5; font-size:.72rem; color:#ccc; background:rgba(0,0,0,.55); padding:4px 12px; border-radius:999px; white-space:nowrap; }

  @media (max-width:820px) {
    .split { flex-direction:column; }
    .panel, .split:hover .panel, .split .panel:hover { flex:none; min-height:100vh; }
    .panel .copy { padding:40px 24px; }
    footer { position:static; transform:none; display:block; text-align:center; background:#111; color:#888; border-radius:0; padding:10px; }
  }
</style>
</head>
<body>
<script src="js/acceso.js"></script>
<div class="split">

  <a class="panel multi" href="Dashboard%20sell%20out.html" aria-label="Dashboard Sell Out: Converse, Umbro y Fila">
    <div class="slide on" style="background-image:url('img/converse-collage.jpg')"></div>
    <div class="slide" style="background-image:url('img/umbro.jpg')"></div>
    <div class="slide" style="background-image:url('img/fila.jpg')"></div>
    <div class="copy">
      <div class="kicker">Sell Out</div>
      <h1><span class="on">Converse</span><span>Umbro</span><span>Fila</span></h1>
      <div class="dots"><i class="on"></i><i></i><i></i></div>
    </div>
  </a>

  <a class="panel madden" href="Dashboard%20Steve%20Madden.html" aria-label="Dashboard Sell Out Steve Madden">
    <div class="copy">
      <div class="kicker">Sell Out</div>
      <h1>Steve<br>Madden</h1>
    </div>
  </a>

</div>
<footer>Grupo Depor · <span id="act">Semanas 27–37</span></footer>
<script>
// fecha de la última carga y última semana publicada (data/semanas.json)
(async () => {
  try {
    const r = await fetch('data/semanas.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const m = await r.json(), S = m.semanas || {};
    const wks = Object.keys(S).sort((a, b) => a - b);
    const fechas = wks.flatMap(w => Object.values(S[w])).filter(Boolean).sort();
    if (!fechas.length) return;
    const f = new Date(fechas[fechas.length - 1]);
    const txt = f.toLocaleDateString('es-CL', { day: 'numeric', month: 'long', year: 'numeric' }) + ' ' + f.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('act').textContent = 'Actualizado el ' + txt + ' · última semana S' + wks[wks.length - 1];
  } catch (e) { /* sin conexión: se deja el texto fijo */ }
})();
</script>

<script>
(function(){
  var slides=document.querySelectorAll('.multi .slide'),
      names=document.querySelectorAll('.multi h1 span'),
      dots=document.querySelectorAll('.multi .dots i'),
      i=0, n=slides.length;
  function go(k){
    [slides,names,dots].forEach(function(list){
      list.forEach(function(el,j){ el.classList.toggle('on', j===k); });
    });
  }
  setInterval(function(){ i=(i+1)%n; go(i); }, 4500);
})();
</script>
</body>
</html>
